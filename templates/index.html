<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📹 YouTube Downloader</h1>
            <p class="subtitle">Скачивайте видео с YouTube в нужном качестве</p>
        </header>

        <main>
            <div class="section">
                <h2>Введите ссылку на видео</h2>
                <div class="input-group">
                    <input 
                        type="text" 
                        id="videoUrl" 
                        placeholder="https://www.youtube.com/watch?v=..."
                        class="url-input"
                    >
                    <button id="loadBtn" class="btn btn-primary">Загрузить информацию</button>
                </div>
                <div id="errorMsg" class="error-message" style="display: none;"></div>
            </div>

            <div id="videoInfo" class="section" style="display: none;">
                <h2>Информация о видео</h2>
                <div class="video-info-container">
                    <img id="thumbnail" src="" alt="Thumbnail" class="thumbnail">
                    <div class="video-details">
                        <h3 id="videoTitle"></h3>
                        <p>Длительность: <span id="duration"></span></p>
                    </div>
                </div>
            </div>

            <div id="formatsSection" class="section" style="display: none;">
                <h2>Выберите качество</h2>
                <div id="formatsList" class="formats-grid">
                    <!-- Форматы будут загружены сюда -->
                </div>
                <button id="downloadBtn" class="btn btn-success" style="display: none;">
                    Скачать видео
                </button>
                <div id="downloadStatus" class="download-status" style="display: none;"></div>
            </div>

            <div id="downloadsSection" class="section">
                <h2>Скачанные видео</h2>
                <div id="downloadsList" class="downloads-list">
                    <p class="loading">Загрузка списка...</p>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 YouTube Downloader. Используется yt-dlp</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
